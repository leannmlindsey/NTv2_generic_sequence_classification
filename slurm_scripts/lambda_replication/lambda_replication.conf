# Nucleotide Transformer v2 (NT-v2) LAMBDA_v1 replication config.
#
# Sourced by:
#   slurm_scripts/lambda_replication/run_lambda_training.sh
#   slurm_scripts/lambda_replication/run_lambda_inference.sh
#   slurm_scripts/lambda_replication/check_training.sh
#   slurm_scripts/lambda_replication/check_inference.sh
#
# Workflow:
#   1. (one time) pre-warm the HF cache from a login node — see the README.
#   2. bash slurm_scripts/lambda_replication/run_lambda_training.sh
#   3. wait for jobs to finish (squeue -u $USER); bash .../check_training.sh
#   4. bash slurm_scripts/lambda_replication/run_lambda_inference.sh
#   5. wait; bash .../check_inference.sh
#
# The pipeline loops over SEGMENT_LENGTHS. For each length it runs:
#   finetune x N seeds (training stage), then best-of-N seed selection by
#   test-set MCC -> winners.json, then inference on the matching-length
#   diagnostics (test/fpr/fnr/gc_control), genome-wide CSVs, and a pretrained
#   embedding analysis (linear probe + 3-layer NN). Outputs are per-length.

# --- REQUIRED -----------------------------------------------------------------

# LAMBDA_v1 dataset root. Expected structure (LAMBDA_v1 layout):
#   $LAMBDA_BASE/train_val_test/<LEN>/{train,val,test}.csv     mixed phage+bacteria
#   $LAMBDA_BASE/fpr_test/<LEN>/bacteria_segments_<LEN>.csv    bacteria-only (FPR control)
#   $LAMBDA_BASE/shuffled_controls/<LEN>/test_shuffled.csv     GC-preserving shuffled control
export LAMBDA_BASE="/vf/users/Irp-jiang/share/lindseylm/LAMBDA_v1"

# Replication output root. Per-length results land under here:
#   $OUTPUT_DIR/<LEN>/finetune/<variant>/seed-<N>/   test_results.json + saved model
#   $OUTPUT_DIR/<LEN>/embedding/<variant>/           embedding_analysis_results.json + .npz
#   $OUTPUT_DIR/<LEN>/winners.json                   picked by run_lambda_inference.sh
#   $OUTPUT_DIR/<LEN>/inference/<variant>/           <dataset>_predictions.csv + _metrics.json
#   $OUTPUT_DIR/logs/                                SLURM stdout/stderr (shared)
#
# NOTE: must live under /data/lindseylm/... — the old /gpfs/gsfs12/users/lindseylm
# path no longer exists for this account.
export OUTPUT_DIR="/data/lindseylm/GLM_EVALUATIONS/NAR_GENOMICS_LAMBDA_REPO/NTv2_generic_sequence_classification/outputs"

# Sequence lengths to run. NT-v2 supports 2k, 4k, and 8k (8k is at the token
# limit — see MAX_LENGTH_8k below). Set to a subset (e.g. "2k 4k") to run fewer.
export SEGMENT_LENGTHS="2k 4k 8k"

# --- OPTIONAL: diagnostics NOT in the train_val_test split -------------------

# FNR (false negative rate) test sets — phage-only sequences. Per-length CSV.
# Variable name is FNR_<LEN> where <LEN> matches an entry in SEGMENT_LENGTHS.
# Leave empty/unset to skip the FNR diagnostic for that length.
# NOTE: 2k uses the phrog-annotated variant (also drives the paper/website
# figure); it is a smaller, different segment set than the 4k sliding-window
# files, so 2k FNR is measured on that annotated subset by design.
export FNR_2k="${LAMBDA_BASE}/fnr_test/2k/phage_annotated_segments_2k.csv"   # VERIFIED
export FNR_4k="${LAMBDA_BASE}/fnr_test/4k/phage_segments_4k_2k.csv"          # VERIFIED
export FNR_8k="${LAMBDA_BASE}/fnr_test/8k/phage_segments_8k_4k.csv"          # VERIFIED

# Genome-wide inputs — per-length DIRECTORY of *.csv segment files (one
# inference job per CSV per variant, then one aggregate analysis job).
# Leave empty/unset to skip genome-wide. Missing dirs are warned-and-skipped.
export GENOME_WIDE_2k="${LAMBDA_BASE}/genome_wide/2k"   # VERIFIED
export GENOME_WIDE_4k="${LAMBDA_BASE}/genome_wide/4k"   # VERIFIED
export GENOME_WIDE_8k="${LAMBDA_BASE}/genome_wide/8k"   # VERIFIED

# FPR (bacteria-only) and GC control (shuffled) are AUTO-DERIVED by the
# inference driver from LAMBDA_BASE — they are NOT set here:
#   ${LAMBDA_BASE}/fpr_test/<LEN>/bacteria_segments_<LEN>.csv      (FPR control)
#   ${LAMBDA_BASE}/shuffled_controls/<LEN>/test_shuffled.csv       (GC control)

# --- OPTIONAL: model + training hyperparameters ------------------------------

# NT-v2 has a single architecture/variant here. Keeping the variant loop mirrors
# the ProkBERT/DNABERT-2 layout (outputs/<len>/finetune/<variant>/...).
export VARIANTS="nt_500m"

# HuggingFace base model used for every variant.
export BASE_MODEL="InstaDeepAI/nucleotide-transformer-v2-500m-multi-species"

# Random seeds for finetuning (one finetune job per variant per seed).
# The embedding analysis (linear probe + 3-layer NN) always runs with EMB_SEED.
export SEEDS="1 2 3 4 5"

# Finetune hyperparameters (from run_train_ntv2.sh / run_optimized_train.sh).
export LR="3e-5"
export EVAL_BATCH_SIZE="16"
export NUM_EPOCHS="10"             # run_optimized_train.sh default (early stopping below)
export EARLY_STOPPING_PATIENCE="3" # run_optimized_train.sh / run_train_ntv2.sh
export WEIGHT_DECAY="0.01"         # run_train_ntv2.sh
export WARMUP_RATIO="0.1"          # run_train_ntv2.sh
export EVAL_STRATEGY="steps"       # run_optimized_train.sh
export EVAL_STEPS="500"            # run_optimized_train.sh
# Per-seed checkpoint selection inside one finetune run uses the HF Trainer with
# metric_for_best_model=eval_mcc + load_best_model_at_end (NT-v2 default). The
# cross-seed winner is picked downstream by select_best_model.py (test-set MCC).
export METRIC_FOR_BEST_MODEL="eval_mcc"

# Precision/optimizer (A100). run_optimized_train.sh uses bf16+tf32 +
# adamw_torch_fused on A100; the lambda finetune job mirrors that.
export PRECISION_FLAGS="--bf16 --tf32"
export OPTIMIZER="adamw_torch_fused"

# Per-window max TOKEN length and per-device train batch size.
# CRITICAL: NT-v2 has a hard ~2048-token limit. These token counts and the
# matching per-window batch sizes come straight from run_optimized_train.sh's
# case "${MAX_LENGTH}" block (512 -> batch 8; 1024 -> batch 1; 2048 -> batch 1)
# and run_memory_test.sh (4k -> 1024 tokens bf16; 8k -> 2048 tokens bf16).
#   2k seq  -> 512 tokens
#   4k seq  -> 1024 tokens
#   8k seq  -> 2048 tokens (at the NT-v2 token cap)
export MAX_LENGTH_2k="512"
export MAX_LENGTH_4k="1024"
export MAX_LENGTH_8k="2048"

# Per-window train batch size (from run_optimized_train.sh A100 case block).
export BATCH_SIZE_2k="8"
export BATCH_SIZE_4k="1"
export BATCH_SIZE_8k="1"
# Per-window gradient accumulation (A100 case block: all 1).
export GRAD_ACCUM_2k="1"
export GRAD_ACCUM_4k="1"
export GRAD_ACCUM_8k="1"

# Embedding analysis hyperparameters (from run_embedding_analysis.sh).
export POOLING="mean"           # mean | max | cls
export EMB_SEED="42"
export NN_EPOCHS="100"
export NN_HIDDEN_DIM="256"
export NN_LR="0.001"

# Include a random-init baseline encoder alongside pretrained ("true"|"false").
export INCLUDE_RANDOM_BASELINE="true"

# --- OPTIONAL: inference -----------------------------------------------------

export INF_BATCH_SIZE="16"
export INF_THRESHOLD="0.5"

# --- OPTIONAL: SLURM resources -----------------------------------------------

export FT_MEM="64g"
export FT_TIME="24:00:00"
export EMB_MEM="64g"
export EMB_TIME="4:00:00"
export INF_MEM="32g"
export INF_TIME="2:00:00"

# Conda environment that has torch + transformers for NT-v2.
export CONDA_ENV="nt"

# HF cache (pre-warm from a login node, then jobs run offline).
export HF_HOME="/data/lindseylm/.cache/huggingface"
